name: Bug report
description: Something in Lantai does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Please do not paste session content, reports, file paths, keys or tokens.** Issues are
        public, and agent sessions often contain private code and secrets. Describe the shape of
        the problem instead, and use made-up examples where you need one.

        For a privacy or security problem, report it privately instead:
        see [SECURITY.md](https://github.com/brant-ruan/lantai/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Click …
        3. See …
  - type: input
    id: version
    attributes:
      label: Lantai version
      description: Shown in the About window, or by `aj --version`.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: "macOS 26.1, Apple M3"
    validations:
      required: true
  - type: dropdown
    id: agents
    attributes:
      label: Agents involved
      multiple: true
      options:
        - Claude Code
        - Codex CLI
        - Antigravity
        - DeepSeek Harness
        - WorkBuddy
        - OpenCode
        - Not related to a specific agent
  - type: textarea
    id: doctor
    attributes:
      label: Output of `aj doctor`
      description: Parsing health of each source. It shows your data directory and may name files in error lines, so replace your user name and file names before posting.
      render: text
