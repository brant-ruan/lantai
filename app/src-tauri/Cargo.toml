[package]
name = "aj-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aj-adapter = { version = "0.1.0", path = "../../crates/aj-adapter" }
aj-core = { version = "0.1.0", path = "../../crates/aj-core" }
aj-sources = { version = "0.1.0", path = "../../crates/aj-sources" }
aj-ir = { version = "0.1.0", path = "../../crates/aj-ir" }
aj-report = { version = "0.1.0", path = "../../crates/aj-report" }
aj-store = { version = "0.1.0", path = "../../crates/aj-store" }
aj-update = { version = "0.1.0", path = "../../crates/aj-update" }
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
aj-backup = { version = "0.1.0", path = "../../crates/aj-backup" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSImage", "NSRunningApplication", "NSWorkspace"] }
