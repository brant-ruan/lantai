[package]
name = "aj-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aj-adapter.workspace = true
aj-backup.workspace = true
aj-core.workspace = true
aj-sources.workspace = true
aj-ir.workspace = true
aj-report.workspace = true
aj-store.workspace = true
aj-update.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSImage", "NSRunningApplication", "NSWorkspace"] }
