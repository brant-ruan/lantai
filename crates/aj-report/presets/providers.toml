# Provider presets shown in Settings > Models > Add provider.
#
# Embedded at compile time by `aj_report::presets`; edit this file to add or change a service.
# A preset only fills the provider form (name and base URL). It is never written to config.toml.
#
# Fields:
#   id        suggested provider name; unique; letters, digits, '-' and '_'
#   name      display name (brand names are not translated)
#   group     "vendor" (model makers), "aggregator" (hosts many models) or "local"
#   region    optional; "global" or "china", only where one vendor runs both sites
#             (their keys are not interchangeable, so each site is its own preset)
#   base_url  OpenAI-compatible root; Lantai appends /chat/completions and /models
#   efforts   optional reasoning_effort suggestions; the values a model accepts vary,
#             so these are only hints and the generic list is used when absent
#
# Only services that work with `Authorization: Bearer` + `/chat/completions` belong here.
# Endpoints were cross-checked against each vendor's docs, LiteLLM and models.dev (2026-11).

# --- Model makers -------------------------------------------------------------------------

