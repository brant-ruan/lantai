[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Workspace crates
aj-adapter = { path = "crates/aj-adapter" }
aj-adapter-antigravity = { path = "crates/aj-adapter-antigravity" }
aj-adapter-claude = { path = "crates/aj-adapter-claude" }
aj-adapter-codex = { path = "crates/aj-adapter-codex" }
aj-adapter-dsh = { path = "crates/aj-adapter-dsh" }
aj-adapter-opencode = { path = "crates/aj-adapter-opencode" }
aj-adapter-workbuddy = { path = "crates/aj-adapter-workbuddy" }
aj-backup = { path = "crates/aj-backup" }
aj-core = { path = "crates/aj-core" }
aj-ir = { path = "crates/aj-ir" }
aj-report = { path = "crates/aj-report" }
aj-sources = { path = "crates/aj-sources" }
aj-store = { path = "crates/aj-store" }
aj-update = { path = "crates/aj-update" }
# Third-party crates used by more than one member; a member adds features it alone needs
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
regex = "1.13.1"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json"] }
zstd = "0.14.4"
